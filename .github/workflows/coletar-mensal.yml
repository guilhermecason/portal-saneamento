name: Coletar noticias mensalmente

on:
  # Roda todo dia 1 de cada mes as 08:00 (horario de Brasilia = 11:00 UTC)
  schedule:
    - cron: "0 11 1 * *"
  # Tambem permite rodar manualmente pela aba "Actions" no GitHub
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo do repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r scraper/requirements.txt

      - name: Rodar o robo coletor
        run: python scraper/coletar_noticias.py

      - name: Salvar as noticias novas no repositorio
        run: |
          git config user.name "Robo Coletor"
          git config user.email "robo-coletor@users.noreply.github.com"
          git add data/noticias.json
          git diff --staged --quiet || git commit -m "Atualizacao mensal de noticias"
          git push

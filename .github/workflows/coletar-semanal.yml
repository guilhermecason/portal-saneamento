name: Coletar noticias semanalmente

on:
  schedule:
    - cron: "0 11 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo do repositorio
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: pip install -r scraper/requirements.txt
      - name: Rodar o robo coletor
        run: python scraper/coletar_noticias.py
      - name: Salvar as noticias novas no repositorio
        run: |
          git config user.name "Robo Coletor"
          git config user.email "robo-coletor@users.noreply.github.com"
          git add data/noticias.json
          git diff --staged --quiet || git commit -m "Atualizacao semanal de noticias"
          git push
